<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garagem Placa Preta</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-dot"></span>
      <span>Garagem<br>Placa Preta</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item active"><i class="ti ti-home"></i> Home</a>
      <a href="central.html" class="nav-item"><i class="ti ti-layout-grid"></i> Central</a>
      <a href="servicos.html" class="nav-item"><i class="ti ti-tool"></i> Serviços</a>
      <a href="status.html" class="nav-item"><i class="ti ti-chart-bar"></i> Status</a>
    </nav>
    <div class="sidebar-footer">v1.0 · interno</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="page-title">Home</span>
      <div class="topbar-right">
        <button class="btn-red" onclick="abrirModalVeiculo()">
          <i class="ti ti-plus"></i> Novo veículo
        </button>
      </div>
    </header>

    <main class="content">

      <div style="background: var(--marrom-escuro); border-radius: 12px; padding: 28px 32px; margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <h2 style="font-size: 22px; font-weight: 600; color: #f5e6d8; margin-bottom: 6px;">Garagem Placa Preta</h2>
          <p style="font-size: 13px; color: var(--marrom-claro);">Sistema interno de gestão de veículos</p>
        </div>
        <i class="ti ti-car" style="font-size: 56px; color: #4a2e1a;"></i>
      </div>

      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">Total de veículos</div><div class="stat-val" id="stat-total">—</div></div>
        <div class="stat-card"><div class="stat-label">Em serviço</div><div class="stat-val red" id="stat-servico">—</div></div>
        <div class="stat-card"><div class="stat-label">Inativos</div><div class="stat-val" id="stat-inativos">—</div></div>
        <div class="stat-card"><div class="stat-label">Serviços pendentes</div><div class="stat-val red" id="stat-pendentes">—</div></div>
      </div>

      <div class="section-label">Veículos recentes</div>
      <div id="home-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px;"></div>

    </main>
  </div>

  <div class="modal-overlay" id="modal-veiculo">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Novo veículo</span>
        <button class="modal-close" onclick="fecharModalVeiculo()"><i class="ti ti-x"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Modelo</label>
            <input class="form-input" type="text" id="v-model" placeholder="Ex: Opala" />
          </div>
          <div class="form-group">
            <label class="form-label">Tipo</label>
            <select class="form-select" id="v-kind">
              <option value="Carro">Carro</option>
              <option value="Moto">Moto</option>
              <option value="Caminhão">Caminhão</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Ano</label>
            <input class="form-input" type="text" id="v-date" placeholder="Ex: 1972" />
          </div>
          <div class="form-group">
            <label class="form-label">Placa</label>
            <input class="form-input" type="text" id="v-plate" placeholder="Ex: PP-1234" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="fecharModalVeiculo()">Cancelar</button>
        <button class="btn-red" onclick="salvarVeiculo()"><i class="ti ti-check"></i> Salvar</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
